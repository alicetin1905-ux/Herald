<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e13">
<title>HERALD · CE 4/2 · 1H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13; --panel:#12161e; --line:#1f2632; --ink:#d7dde6; --mute:#6b7685;
  --long:#2fd48a; --short:#ff5c6a; --amber:#f2b84b; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --disp:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.12em}
h1 small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--mute);letter-spacing:.08em;margin-left:8px}
#clock{color:var(--mute);font-size:11px;text-align:right;line-height:1.5}
#clock b{color:var(--ink);font-weight:600}

.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
button{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.on{border-color:var(--long);color:var(--long)}
button.warn{border-color:var(--amber);color:var(--amber)}

.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:14px 1fr auto;grid-template-rows:auto auto;column-gap:12px;row-gap:6px;align-items:center;position:relative;overflow:hidden}
.row.flash::after{content:"";position:absolute;inset:0;background:currentColor;opacity:.16;animation:flash 1.2s ease-out 3}
.row.long{color:var(--long)} .row.short{color:var(--short)} .row.wait{color:var(--amber)}
@keyframes flash{from{opacity:.3}to{opacity:0}}
.led{width:14px;height:14px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;grid-row:1/3}
.sym{font-family:var(--disp);font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.04em}
.sym em{font-style:normal;color:var(--mute);font-size:11px;margin-left:4px}
.price{font-size:18px;font-weight:600;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.dir{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.stop{font-size:11px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.stop b{color:var(--ink);font-weight:400}

h2{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:22px 0 8px;display:flex;justify-content:space-between}
h2 a{color:var(--mute);text-decoration:none;cursor:pointer}
.log{display:flex;flex-direction:column;gap:2px}
.log div{display:grid;grid-template-columns:52px 76px 1fr auto;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.log .b{color:var(--long);font-weight:600}.log .s{color:var(--short);font-weight:600}
.log .t{color:var(--mute)} .log .p{text-align:right}
.empty{color:var(--mute);font-size:12px;padding:12px 6px}
#toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 10px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.06em;display:none;z-index:9;max-width:532px;margin:0 auto}
#toast.b{border-color:var(--long);color:var(--long)}#toast.s{border-color:var(--short);color:var(--short)}
#status{color:var(--mute);font-size:11px;margin-top:12px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.row.flash::after{animation:none;opacity:.16}}
</style>
</head>
<body>
<header>
  <h1>HERALD<small>CE 4 / 2 · 1H</small></h1>
  <div id="clock">next close in<br><b id="cd">--:--</b></div>
</header>

<div class="bar">
  <button id="arm" class="warn">Arm alerts</button>
  <button id="wake">Keep awake</button>
  <button id="test">Test sound</button>
</div>

<div class="rows" id="rows"></div>

<h2>Signals <a id="clear">clear</a></h2>
<div class="log" id="log"></div>
<div id="status">Loading candles…</div>
<div id="toast"></div>

<script>
// ---------- config ----------
const SYMBOLS = ["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","DOGEUSDT"];
const LEN = 4, MULT = 2, INTERVAL = "60", CANDLES = 200;
const HOUR = 3600000;
const LS = { log:"herald.log", alerted:"herald.alerted" };

// ---------- Chandelier Exit (Everget), useClose = true ----------
function chandelierExit(c, length, mult){
  const n=c.length, tr=new Array(n), atr=new Array(n).fill(NaN);
  for(let i=0;i<n;i++){
    if(i===0){tr[i]=c[i].high-c[i].low;continue;}
    const pc=c[i-1].close; tr[i]=Math.max(c[i].high-c[i].low,Math.abs(c[i].high-pc),Math.abs(c[i].low-pc));
  }
  let sum=0;
  for(let i=0;i<n;i++){
    if(i<length){sum+=tr[i]; if(i===length-1)atr[i]=sum/length; continue;}
    atr[i]=(atr[i-1]*(length-1)+tr[i])/length;
  }
  const out=new Array(n); let pL=NaN,pS=NaN,pD=1;
  for(let i=0;i<n;i++){
    if(isNaN(atr[i])){out[i]=null;continue;}
    let hi=-Infinity,lo=Infinity;
    for(let k=i-length+1;k<=i;k++){hi=Math.max(hi,c[k].close);lo=Math.min(lo,c[k].close);}
    const a=mult*atr[i]; let L=hi-a, S=lo+a; const pc=c[i-1].close;
    if(!isNaN(pL)&&pc>pL)L=Math.max(L,pL);
    if(!isNaN(pS)&&pc<pS)S=Math.min(S,pS);
    const close=c[i].close; let d=pD;
    if(!isNaN(pS)&&close>pS)d=1; else if(!isNaN(pL)&&close<pL)d=-1;
    out[i]={time:c[i].time,close,longStop:L,shortStop:S,dir:d,buy:d===1&&pD===-1,sell:d===-1&&pD===1};
    pL=L;pS=S;pD=d;
  }
  return out;
}

// ---------- data ----------
async function klines(sym){
  const r=await fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}&interval=${INTERVAL}&limit=${CANDLES}`);
  const j=await r.json(); if(j.retCode!==0)throw new Error(sym+" "+j.retMsg);
  return j.result.list.slice(1).reverse().map(x=>({time:+x[0],open:+x[1],high:+x[2],low:+x[3],close:+x[4]}));
}
async function tickers(){
  const r=await fetch(`https://api.bybit.com/v5/market/tickers?category=linear`);
  const j=await r.json(); const m={};
  for(const t of j.result.list) if(SYMBOLS.includes(t.symbol)) m[t.symbol]=+t.lastPrice;
  return m;
}

// ---------- state ----------
const state={}; // sym -> {last, price}
let log=JSON.parse(localStorage.getItem(LS.log)||"[]");
let alerted=JSON.parse(localStorage.getItem(LS.alerted)||"{}");
let armed=false, audioCtx=null, wakeLock=null, lastEvalHour=0;
const fmt=x=>x>=100?x.toFixed(2):x>=1?x.toFixed(4):x.toFixed(6);
const hhmm=t=>{const d=new Date(t);return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});};
const dm=t=>{const d=new Date(t);return d.toLocaleDateString([], {day:"2-digit",month:"2-digit"});};

// ---------- alerts ----------
function beep(sig){
  if(!audioCtx)return;
  const seq=sig==="BUY"?[660,880,1100]:[880,660,440];
  seq.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="square";o.frequency.value=f;g.gain.value=.0001;o.connect(g);g.connect(audioCtx.destination);
    const t=audioCtx.currentTime+i*.18;o.start(t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.stop(t+.18);});
}
function notify(sig,sym,price){
  const toast=document.getElementById("toast");
  toast.textContent=`${sig==="BUY"?"▲":"▼"} ${sig} ${sym}.P  ${fmt(price)}`;
  toast.className=sig==="BUY"?"b":"s"; toast.style.display="block";
  clearTimeout(toast._t); toast._t=setTimeout(()=>toast.style.display="none",15000);
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);
  beep(sig);
  if("Notification"in window&&Notification.permission==="granted"){
    try{new Notification(`${sig} ${sym}.P · CE 4/2 1H`,{body:`Close ${fmt(price)}`,tag:sym});}catch(e){}
  }
}

// ---------- evaluate ----------
async function evaluate(seed=false){
  const results=await Promise.allSettled(SYMBOLS.map(async s=>{
    const c=await klines(s); const ce=chandelierExit(c,LEN,MULT);
    return {s,ce};
  }));
  const now=Date.now();
  for(const r of results){
    if(r.status!=="fulfilled"){setStatus("Fetch failed: "+r.reason.message);continue;}
    const {s,ce}=r.value; const last=ce[ce.length-1];
    state[s]={...(state[s]||{}),last};
    if(seed){
      // seed log with last flips from history so the screen is never empty
      ce.filter(x=>x&&(x.buy||x.sell)).slice(-4).forEach(x=>pushLog(s,x.buy?"BUY":"SELL",x.time,x.close,false));
      alerted[s]=String(last.time);
    }else{
      const sig=last.buy?"BUY":last.sell?"SELL":null;
      if(sig&&alerted[s]!==String(last.time)){
        alerted[s]=String(last.time);
        pushLog(s,sig,last.time,last.close,true);
        if(armed)notify(sig,s,last.close);
        document.getElementById("r-"+s)?.classList.add("flash");
      }
    }
  }
  localStorage.setItem(LS.alerted,JSON.stringify(alerted));
  lastEvalHour=Math.floor(now/HOUR);
  renderRows(); renderLog();
  setStatus(`Candles checked ${hhmm(now)} · closed-candle only · ${armed?"alerts armed":"alerts not armed — tap Arm alerts"}`);
}
function pushLog(sym,sig,time,price,fresh){
  if(log.some(l=>l.sym===sym&&l.time===time))return;
  log.push({sym,sig,time,price}); log.sort((a,b)=>b.time-a.time); log=log.slice(0,60);
  localStorage.setItem(LS.log,JSON.stringify(log));
}

// ---------- render ----------
function renderRows(){
  const el=document.getElementById("rows"); el.innerHTML="";
  for(const s of SYMBOLS){
    const st=state[s]; const d=document.createElement("div"); d.id="r-"+s;
    const cls=!st?.last?"wait":st.last.dir===1?"long":"short";
    d.className="row "+cls;
    const l=st?.last; const px=st?.price??l?.close;
    d.innerHTML=`<div class="led"></div>
      <div class="sym">${s.replace("USDT","")}<em>USDT.P</em></div>
      <div class="price">${px?fmt(px):"—"}</div>
      <div class="dir">${!l?"loading":l.dir===1?"long · stop below":"short · stop above"}</div>
      <div class="stop">${l?`CE <b>${fmt(l.dir===1?l.longStop:l.shortStop)}</b> · closed ${hhmm(l.time+HOUR)}`:""}</div>`;
    el.appendChild(d);
  }
}
function renderLog(){
  const el=document.getElementById("log");
  if(!log.length){el.innerHTML='<div class="empty">No flips yet. The log fills as 1H candles close.</div>';return;}
  el.innerHTML=log.map(l=>`<div><span class="t">${dm(l.time+HOUR)} ${hhmm(l.time+HOUR)}</span><span>${l.sym.replace("USDT","")}</span><span class="${l.sig==="BUY"?"b":"s"}">${l.sig}</span><span class="p">${fmt(l.price)}</span></div>`).join("");
}
function setStatus(t){document.getElementById("status").textContent=t;}
function tickClock(){
  const now=Date.now(); const rem=HOUR-(now%HOUR);
  const m=Math.floor(rem/60000), s=Math.floor(rem%60000/1000);
  document.getElementById("cd").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

// ---------- loops ----------
async function priceLoop(){
  try{const p=await tickers(); for(const s in p){state[s]={...(state[s]||{}),price:p[s]};}
    for(const s of SYMBOLS){const el=document.querySelector(`#r-${s} .price`); if(el&&state[s]?.price)el.textContent=fmt(state[s].price);}
  }catch(e){}
}
async function candleLoop(){
  const now=Date.now(); const hour=Math.floor(now/HOUR);
  // re-evaluate once the new hour has started and Bybit has had 20s to close the bar
  if(hour>lastEvalHour && now%HOUR>20000){ try{await evaluate(false);}catch(e){setStatus("Error: "+e.message);} }
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){lastEvalHour=0;candleLoop();priceLoop();} });

// ---------- buttons ----------
document.getElementById("arm").onclick=async()=>{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume(); armed=true;
  if("Notification"in window&&Notification.permission==="default"){try{await Notification.requestPermission();}catch(e){}}
  const b=document.getElementById("arm"); b.textContent="Alerts armed"; b.className="on";
  setStatus("Alerts armed · keep this screen open");
};
document.getElementById("test").onclick=()=>{ if(!audioCtx){setStatus("Arm alerts first");return;} notify("BUY","TEST",1234.5); };
document.getElementById("wake").onclick=async()=>{
  const b=document.getElementById("wake");
  if(wakeLock){await wakeLock.release();wakeLock=null;b.textContent="Keep awake";b.className="";return;}
  try{wakeLock=await navigator.wakeLock.request("screen");b.textContent="Awake";b.className="on";
    wakeLock.addEventListener("release",()=>{wakeLock=null;b.textContent="Keep awake";b.className="";});}
  catch(e){setStatus("Wake lock unavailable — set Auto-Lock to Never in iOS Settings");}
};
document.getElementById("clear").onclick=()=>{log=[];localStorage.setItem(LS.log,"[]");renderLog();};

// ---------- boot ----------
renderRows(); renderLog(); tickClock();
setInterval(tickClock,1000); setInterval(priceLoop,10000); setInterval(candleLoop,5000);
evaluate(true).then(priceLoop).catch(e=>setStatus("Error: "+e.message));
</script>
</body>
</html>
